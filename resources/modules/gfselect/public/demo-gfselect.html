<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Demo GFSelect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Estilos rápidos con Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos de GFSelect -->
  <style>
    body {
      background: #f8f9fa;
      padding: 2rem;
    }
    h1 {
      margin-bottom: 2rem;
    }
    .demo-box {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="text-center">Demo: GFSelect</h1>

    <div class="demo-box">
      <h5>1. Select básico mejorado</h5>
      <select id="select-basic" class="form-select">
        <option value="1">Manzana</option>
        <option value="2">Banana</option>
        <option value="3">Cereza</option>
        <option value="4">Dátil</option>
      </select>
    </div>

    <div class="demo-box">
      <h5>2. Con búsqueda activada</h5>
      <select id="select-search" class="form-select">
        <option value="1">Cuba</option>
        <option value="2">España</option>
        <option value="3">México</option>
        <option value="4">Argentina</option>
        <option value="5">Venezuela</option>
        <option value="6">Chile</option>
        <option value="7">Perú</option>
        <option value="8">Colombia</option>
        <option value="9">Uruguay</option>
      </select>
    </div>

    <div class="demo-box">
      <h5>3. Con clases personalizadas</h5>
      <select id="select-custom" class="form-select">
        <option value="1">Rojo</option>
        <option value="2">Verde</option>
        <option value="3">Azul</option>
        <option value="4">Amarillo</option>
      </select>
    </div>

    <div class="demo-box">
      <h5>4. Destruir GFSelect dinámicamente</h5>
      <select id="select-destroy" class="form-select">
        <option value="1">Uno</option>
        <option value="2">Dos</option>
        <option value="3">Tres</option>
      </select>
      <button id="destroy-btn" class="btn btn-danger mt-3">Destruir componente</button>
    </div>
  </div>


  <!-- Scripts -->
  <script src="gf-select.js"></script>
  <script>
    const basic = new GFSelect('#select-basic');

    const search = new GFSelect('#select-search', {
      searchable: true,
      searchLabel: 'Buscar país...',
      maxHeight: 180
    });

      const custom = new GFSelect('#select-custom', {
      toggleClass: 'btn btn-outline-primary',
      menuClass: 'dropdown-menu shadow',
      wrapperClass: 'dropdown',
      searchable: false
    });

    const destroyable = new GFSelect('#select-destroy', {
      searchable: true,
      onChange: (v, l) => console.log("Cambio:", v, l)
    });

    document.getElementById('destroy-btn').addEventListener('click', () => {
      destroyable.destroy();
      alert("GFSelect destruido y select restaurado.");
    });
  </script>
</body>
</html>
