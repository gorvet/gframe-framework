<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="es">
<head>
	<title>{{title}}</title>
	<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
	<!--[if !mso]><!-->
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<!--<![endif]-->
	<meta name="x-apple-disable-message-reformatting" content="" />
	<meta content="target-densitydpi=device-dpi" name="viewport" />
	<meta content="true" name="HandheldFriendly" />
	<meta content="width=device-width" name="viewport" />
	<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no" />
	<style type="text/css">
		
		body {
			min-width:100%;
			Margin:0px;
			padding:0px;
			background-color:{{mailBodyBg}};
			font-family:{{mailFont}};
			color: {{mailBodyColor}};
		}

		.fw {width: 100%;}

		.container {
			padding:20px 10px 20px 10px;
			text-align: center;
		}

		.card-header {
			overflow:hidden;
			padding:20px 30px 20px 30px;
			border-radius:8px 8px 0 0;
		}

		.logo{max-height: 55px;}

		.card{
			display:inline-table; 
			max-width:600px;
			width:100%;
			text-align:center;
			vertical-align:top
		}
		.card-body{
			padding: 30px;
			background: #fff;
			border-radius: 8px;

		}
		h1 {

			line-height:40px;
			font-weight:700;
			font-size:28px;
			color:{{mailPrimary}};
			text-align: left;
			margin-top: 0;	

		}
		p {
			line-height:28px;
			font-weight:500;
			font-size:18px;
			text-align:left;
		}

		.btn {
			display:block;
			font-size:16px;
			text-decoration:none;
			color:#FFFFFF;
			text-align:center;
			max-width:250px;
			border-radius:5px;
			margin: auto;
			background: {{mailPrimary}};
			border: none;
			min-width: 150px;
			padding: 10px 20px;
			margin-bottom: 10px;
		}
		.p2{
			font-size:16px;
			text-align:left;
		}
		.btn:hover{ background: {{mailPrimary}}; color: #fff; text-decoration: none;}
		a { text-decoration: none; color: {{mailPrimary}};}
		a:hover { color: {{mailPrimary}}; text-decoration:underline ;}

	</style>
</head>
<body style="margin:0;padding:0;background:{{mailBodyBg}};color:{{mailBodyColor}};font-family:{{mailFont}};">
	<div class="fw">
		<div class="container">
			<div class="card">
				<div class="card-header"> 
					<img class="logo"     alt="{{mailSiteName}}" src="{{mailLogo}}"/>
				</div>
				<div class="card-body" style="{{mailCardBodyStyle}}">
					<h1 style="{{mailH1Style}}">{{h1}}</h1>
					<p style="{{mailTextStyle}}">{{p1}}</p>
					<a style="{{mailButtonStyle}}" class="btn" href="{{aHref}}" target="_blank">{{aText}}</a>
					<p style="{{mailTextStyle}}">O haz clic en el siguiente enlace: <a href="{{aHref}}" target="_blank">{{aText}}</a></p>
					<p style="{{mailSmallTextStyle}}" class="p2">{{p2}}</p>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
