# Incluir dentro del server del proyecto, sin otro manejador PHP genérico.
# El server define root y $gframe_php (socket Unix o dirección de PHP-FPM).
index index.php;
autoindex off;
recursive_error_pages off;
fastcgi_intercept_errors off;

set $gframe_script /index.php;
set $gframe_server_error 0;

# Parámetros heredados por todos los destinos FastCGI de este fragmento.
fastcgi_param SCRIPT_FILENAME $document_root$gframe_script;
fastcgi_param SCRIPT_NAME $gframe_script;
fastcgi_param QUERY_STRING $query_string;
fastcgi_param REQUEST_METHOD $request_method;
fastcgi_param CONTENT_TYPE $content_type;
fastcgi_param CONTENT_LENGTH $content_length;
fastcgi_param REQUEST_URI $request_uri;
fastcgi_param DOCUMENT_URI $uri;
fastcgi_param DOCUMENT_ROOT $document_root;
fastcgi_param SERVER_PROTOCOL $server_protocol;
fastcgi_param REQUEST_SCHEME $scheme;
fastcgi_param HTTPS $https if_not_empty;
fastcgi_param GATEWAY_INTERFACE CGI/1.1;
fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
fastcgi_param REMOTE_ADDR $remote_addr;
fastcgi_param REMOTE_PORT $remote_port;
fastcgi_param SERVER_ADDR $server_addr;
fastcgi_param SERVER_PORT $server_port;
fastcgi_param SERVER_NAME $server_name;
fastcgi_param REDIRECT_STATUS 200;
fastcgi_param GFRAME_SERVER_ERROR $gframe_server_error;

error_page 403 = @gframe_error403;
error_page 404 = @gframe_error404;
error_page 500 = @gframe_error500;
error_page 503 = @gframe_error503;

location @gframe_error403 {
    set $gframe_server_error 403;
    fastcgi_pass $gframe_php;
}
location @gframe_error404 {
    set $gframe_server_error 404;
    fastcgi_pass $gframe_php;
}
location @gframe_error500 {
    set $gframe_server_error 500;
    fastcgi_pass $gframe_php;
}
location @gframe_error503 {
    set $gframe_server_error 503;
    fastcgi_pass $gframe_php;
}

location = /index.php {
    try_files /index.php =404;
    fastcgi_pass $gframe_php;
}
# El instalador se bloquea por sí mismo tras instalar. Puede retirarse este
# location y bloquear install.php explícitamente al desplegar en producción.
location = /install.php {
    set $gframe_script /install.php;
    try_files /install.php =404;
    fastcgi_pass $gframe_php;
}

# Desafíos ACME: solo nombres de token, sin scripts ni otros archivos ocultos.
location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
    default_type text/plain;
    try_files $uri =404;
}
location ~* ^/(app|bin|config|core|deployment|packages|storage)(/|$) {
    return 403;
}
location ~ /\. {
    return 403;
}
location ~* ^/(composer\.(json|lock)|README\.md|LICENSE)(/|$) {
    return 403;
}
location ~* \.(php[0-9]*|phtml|phar|sql|sqlite|sqlite3|log|bak)(/|$) {
    return 403;
}
location /public/ {
    try_files $uri =404;
}
# Biblioteca pública estándar; el ámbito no equivale a permisos de descarga.
location ~ ^/uploads/(?:library|(?:user|tenant)/[1-9][0-9]*/library)/ {
    try_files $uri =404;
}
# Otras fuentes y descargas no se publican automáticamente.
location /uploads/ { return 403; }
location /downloads/ { return 403; }
location /download/ { return 403; }
location / {
    rewrite ^ /index.php last;
}
