<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Cómo se decide un permiso en GFrame</title><desc id="desc">La ruta autentica al actor. El superadministrador tiene bypass de permisos. Para otros roles se valida el ámbito global o tenant y se resuelve el permiso. El proyecto sigue autorizando cada registro.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
<rect width="1120" height="640" rx="20" fill="#f6f8fc"/>
<g font-family="Arial,sans-serif" fill="#18283b"><text x="48" y="57" font-size="30" font-weight="bold">Permisos: de la identidad a la decisión</text><text x="48" y="91" font-size="17">Contrato del framework · Las reglas del recurso pertenecen a la aplicación</text></g>
<g stroke="#cbd5e1" fill="white"><rect x="48" y="137" width="224" height="106" rx="12"/><rect x="333" y="137" width="275" height="106" rx="12"/><rect x="333" y="310" width="275" height="113" rx="12"/><rect x="674" y="310" width="390" height="113" rx="12"/><rect x="804" y="137" width="260" height="106" rx="12" fill="#e6f5ef"/></g>
<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M272 190H333"/><path d="M608 190H804"/><path d="M470 243V310"/><path d="M608 365H674"/></g>
<g font-family="Arial,sans-serif" font-size="19" fill="#18283b"><text x="70" y="179" font-weight="bold">Sesión autenticada</text><text x="70" y="211" font-size="16">Middleware auth</text><text x="355" y="179" font-weight="bold">¿Superadministrador?</text><text x="355" y="211" font-size="16">Rol protegido del sistema</text><text x="675" y="175" font-size="16">Sí: bypass</text><text x="486" y="284" font-size="16">No</text><text x="826" y="179" font-weight="bold">Permiso concedido</text><text x="826" y="211" font-size="16">Continúa el flujo</text><text x="355" y="351" font-weight="bold">Validar el ámbito</text><text x="355" y="383" font-size="16">Global o tenant configurado</text><text x="355" y="405" font-size="16">Identidad y contexto coherentes</text><text x="696" y="351" font-weight="bold">Resolver can:permiso</text><text x="696" y="383" font-size="16">Permisos efectivos de rol y usuario</text><text x="696" y="405" font-size="16">Conceder o denegar según el contrato</text></g>
<rect x="48" y="475" width="1016" height="119" rx="12" fill="#fff5dc"/>
<g font-family="Arial,sans-serif" fill="#574018"><text x="72" y="508" font-size="20" font-weight="bold">Un permiso no selecciona ni autoriza por sí solo los datos del recurso</text><text x="72" y="540" font-size="17">La aplicación debe comprobar el registro, el propietario y el ámbito de sus consultas.</text><text x="72" y="568" font-size="17">Los rechazos de auth, contexto o permiso detienen la operación; la interfaz no sustituye esos controles.</text></g>
</svg>
