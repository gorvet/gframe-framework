<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Una transacción agrupa escrituras de la misma conexión</title><desc id="desc">El servicio abre la transacción, realiza las escrituras sobre una conexión y confirma si todas terminan correctamente. Ante un fallo revierte esa transacción. Archivos y llamadas externas quedan fuera del rollback.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#596780"/></marker></defs>
<rect width="1120" height="640" rx="20" fill="#f3f5fb"/>
<g font-family="Arial,sans-serif" fill="#203448">
<text x="48" y="65" font-size="30" font-weight="700">Una operación, una conexión, un resultado</text>
<text x="48" y="101" font-size="18">El servicio valida permisos y reglas de negocio antes de confirmar los datos.</text>
<rect x="48" y="137" width="1024" height="341" rx="16" fill="#fff" stroke="#aab6cd" stroke-dasharray="6 5"/>
<text x="76" y="175" font-size="21" font-weight="700">Todas las escrituras usan la conexión elegida: catalog</text>
<rect x="76" y="204" width="270" height="91" rx="12" fill="#e9e3ff"/><text x="100" y="239" font-size="21" font-weight="700">Abrir transacción</text><text x="100" y="270" font-size="17">beginTransaction</text>
<rect x="425" y="204" width="270" height="91" rx="12" fill="#edf1f8"/><text x="449" y="239" font-size="21" font-weight="700">Primera escritura</text><text x="449" y="270" font-size="17">Crear el pedido</text>
<rect x="774" y="204" width="270" height="91" rx="12" fill="#edf1f8"/><text x="798" y="239" font-size="21" font-weight="700">Segunda escritura</text><text x="798" y="270" font-size="17">Actualizar existencias</text>
<path d="M346 250H416M695 250H765" fill="none" stroke="#596780" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M910 295V322H560V342M560 322H211V342" fill="none" stroke="#596780" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="76" y="349" width="365" height="94" rx="12" fill="#fff0e8"/>
<text x="100" y="384" font-size="21" font-weight="700">Ante un fallo: rollBack</text><text x="100" y="415" font-size="17">Revertir y devolver un error seguro.</text>
<rect x="500" y="349" width="544" height="94" rx="12" fill="#e4f3ed"/>
<text x="524" y="384" font-size="21" font-weight="700">Todas correctas: commit</text><text x="524" y="415" font-size="17">Confirmar después de comprobar los resultados.</text>
<rect x="48" y="514" width="1024" height="90" rx="12" fill="#203448"/>
<text x="72" y="550" font-size="20" font-weight="700" fill="#fff">Fuera de esta transacción: otras conexiones, archivos y servicios externos.</text>
<text x="72" y="580" font-size="17" fill="#fff">Un rollback de PDO no deshace un correo enviado ni una llamada HTTP.</text>
</g></svg>
