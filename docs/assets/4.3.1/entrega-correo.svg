<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Solicitar un envío no confirma su recepción</title><desc id="desc">MailService: lanzamiento Async, ejecución del worker y aceptación SMTP.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#596780"/></marker></defs>
<rect width="1120" height="640" rx="20" fill="#f3f5fb"/><g font-family="Arial,sans-serif">
<text x="48" y="65" font-size="27" fill="#203448" font-weight="700">Solicitar un envío no confirma su recepción</text>
<text x="48" y="104" font-size="18" fill="#203448" font-weight="400">MailService: lanzamiento Async, ejecución del worker y aceptación SMTP.</text>
<rect x="48" y="158" width="304" height="190" rx="12" fill="#fff" stroke="#c6cce0"/>
<text x="68" y="196" font-size="21" fill="#203448" font-weight="700">Acción web</text>
<text x="68" y="238" font-size="17" fill="#203448" font-weight="400">Valida el formulario.</text>
<text x="68" y="268" font-size="17" fill="#203448" font-weight="400">Solicita el envío Async.</text>
<text x="68" y="298" font-size="17" fill="#203448" font-weight="400">Recibe mail_queued o fallo.</text>
<path d="M352 253H397" stroke="#596780" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="408" y="158" width="304" height="190" rx="12" fill="#e9e3ff" stroke="#c6cce0"/>
<text x="428" y="196" font-size="21" fill="#203448" font-weight="700">Worker</text>
<text x="428" y="238" font-size="17" fill="#203448" font-weight="400">Carga la aplicación.</text>
<text x="428" y="268" font-size="17" fill="#203448" font-weight="400">Lee SMTP y la plantilla.</text>
<text x="428" y="298" font-size="17" fill="#203448" font-weight="400">Intenta realizar el envío.</text>
<path d="M712 253H757" stroke="#596780" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="768" y="158" width="304" height="190" rx="12" fill="#fff" stroke="#c6cce0"/>
<text x="788" y="196" font-size="21" fill="#203448" font-weight="700">Servidor SMTP</text>
<text x="788" y="238" font-size="17" fill="#203448" font-weight="400">Acepta o rechaza el mensaje.</text>
<text x="788" y="268" font-size="17" fill="#203448" font-weight="400">La aceptación no prueba</text>
<text x="788" y="298" font-size="17" fill="#203448" font-weight="400">recepción en la bandeja.</text>
<rect x="48" y="392" width="1024" height="200" rx="12" fill="#203448"/>
<text x="72" y="430" font-size="17" fill="#fff" font-weight="400">mail_queued solo confirma el lanzamiento aceptado, no el resultado SMTP.</text>
<text x="72" y="465" font-size="17" fill="#fff" font-weight="400">Los fallos posteriores se registran; estos métodos no aportan reintentos automáticos.</text>
<text x="72" y="500" font-size="17" fill="#fff" font-weight="400">En un worker puedes utilizar el método síncrono: no hace falta volver a encolar.</text>
</g></svg>
