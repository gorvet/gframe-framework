<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Una política para la página y sus índices</title><desc id="desc">Decide qué puede indexarse; protege el acceso mediante autorización.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#596780"/></marker></defs>
<rect width="1120" height="640" rx="20" fill="#f3f5fb"/><g font-family="Arial,sans-serif">
<text x="48" y="65" font-size="27" fill="#203448" font-weight="700">Una política para la página y sus índices</text>
<text x="48" y="104" font-size="18" fill="#203448" font-weight="400">Decide qué puede indexarse; protege el acceso mediante autorización.</text>
<rect x="48" y="158" width="304" height="190" rx="12" fill="#fff" stroke="#c6cce0"/>
<text x="68" y="196" font-size="21" fill="#203448" font-weight="700">Configuración global</text>
<text x="68" y="238" font-size="17" fill="#203448" font-weight="400">SEO e indexación habilitados</text>
<text x="68" y="268" font-size="17" fill="#203448" font-weight="400">o bloqueados para el sitio.</text>
<text x="68" y="298" font-size="17" fill="#203448" font-weight="400">Una ruta no supera el bloqueo.</text>
<path d="M352 253H397" stroke="#596780" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="408" y="158" width="304" height="190" rx="12" fill="#e9e3ff" stroke="#c6cce0"/>
<text x="428" y="196" font-size="21" fill="#203448" font-weight="700">Elegibilidad de ruta</text>
<text x="428" y="238" font-size="17" fill="#203448" font-weight="400">Tipo y protección de ruta.</text>
<text x="428" y="268" font-size="17" fill="#203448" font-weight="400">context.seo.indexable.</text>
<text x="428" y="298" font-size="17" fill="#203448" font-weight="400">Exclusiones de cada índice.</text>
<path d="M712 253H757" stroke="#596780" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="768" y="158" width="304" height="190" rx="12" fill="#fff" stroke="#c6cce0"/>
<text x="788" y="196" font-size="21" fill="#203448" font-weight="700">Salidas</text>
<text x="788" y="238" font-size="17" fill="#203448" font-weight="400">Metas del HTML.</text>
<text x="788" y="268" font-size="17" fill="#203448" font-weight="400">sitemap.xml y llms.txt</text>
<text x="788" y="298" font-size="17" fill="#203448" font-weight="400">según su política aplicable.</text>
<rect x="48" y="392" width="1024" height="200" rx="12" fill="#203448"/>
<text x="72" y="430" font-size="17" fill="#fff" font-weight="400">seo.indexable=false excluye de Sitemap y LLMS y fuerza noindex en el HTML.</text>
<text x="72" y="465" font-size="17" fill="#fff" font-weight="400">Las pantallas protegidas no se publican como rutas públicas indexables.</text>
<text x="72" y="500" font-size="17" fill="#fff" font-weight="400">robots.txt, noindex y la ausencia en un sitemap no sustituyen auth ni permisos.</text>
</g></svg>
