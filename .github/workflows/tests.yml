name: Pruebas

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: composer check

  cron-mysql:
    name: Cron con MySQL y procesos reales
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gframe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgframe_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      GFRAME_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306
      GFRAME_TEST_MYSQL_USER: root
      GFRAME_TEST_MYSQL_PASSWORD: gframe_test
      GFRAME_CRON_TEST_ENGINE: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: php packages/phpunit/phpunit/phpunit --filter 'CronConcurrency|MySqlMigrationIntegration'

  cron-windows:
    name: Cron y CSRF con procesos Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: php packages/phpunit/phpunit/phpunit --filter 'CronConcurrency|CronHttpExecutor|VirtualCronHttp|VisitorCsrf'

  cron-https-fpm:
    name: Cron HTTPS con Nginx y PHP-FPM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: sudo apt-get update && sudo apt-get install -y nginx php8.3-fpm php8.3-sqlite3 php8.3-mbstring php8.3-xml
      - run: php packages/phpunit/phpunit/phpunit --filter CronHttpsFpmTest
        env:
          GFRAME_TEST_NGINX: /usr/sbin/nginx
          GFRAME_TEST_PHP_FPM: /usr/sbin/php-fpm8.3

  infrastructure-84:
    name: MySQL, HTTP y Redis reales con PHP 8.4
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gframe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgframe_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      GFRAME_TEST_MYSQL: '1'
      GFRAME_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306
      GFRAME_TEST_MYSQL_USER: root
      GFRAME_TEST_MYSQL_PASSWORD: gframe_test
      GFRAME_TEST_REDIS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite, redis
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: php packages/phpunit/phpunit/phpunit --filter 'MySqlMigrationIntegration|DatabasePreflight|InstallerTest|InstallerHttp|InstallerWizardHttp|RedisSessionIntegration' --fail-on-skipped

  nginx-cgi:
    name: Routing real con Nginx y PHP-CGI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: sudo apt-get update && sudo apt-get install -y nginx php8.3-cgi php8.3-sqlite3 php8.3-mbstring php8.3-xml
      - run: php packages/phpunit/phpunit/phpunit --filter 'ServerRoutingTest::testRealNginxRoutesRequestsAndServerErrorsToTheInstalledFramework' --fail-on-skipped
        env:
          GFRAME_TEST_NGINX: /usr/sbin/nginx
          GFRAME_TEST_PHP_CGI: /usr/bin/php-cgi8.3

  javascript:
    name: JavaScript (sin navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test --test-reporter=tap tests/js/*.test.cjs

  browser:
    name: Recorridos reales con Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite, gd
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar navegador de pruebas en el directorio temporal
        run: |
          npm install --prefix "$RUNNER_TEMP/gframe-browser" --no-package-lock --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/gframe-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/gframe-browser/node_modules" >> "$GITHUB_ENV"
      - name: Ejecutar todos los recorridos de navegador
        run: |
          export GFRAME_TEST_PHP="$(command -v php)"
          export GFRAME_TEST_BROWSER="$(node -p 'require("playwright").chromium.executablePath()')"
          node --test --test-concurrency=1 --test-reporter=tap tests/js/*.test.cjs

  skills-metadata:
    name: Metadata YAML de skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python bin/validate-skills-metadata.py
      - run: python -m unittest discover -s tests -p 'test_skill_metadata.py'

  phpstan:
    name: Análisis estático (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: composer analyse
      - name: Verificar rechazo de errores nuevos
        run: |
          test ! -e src/GFrame/StaticAnalysisRegressionProbe.php
          trap 'rm -f src/GFrame/StaticAnalysisRegressionProbe.php .phpstan-regression.json' EXIT
          printf '%s\n' '<?php namespace GFrame; function staticAnalysisRegressionProbe(): int { return "invalid"; }' > src/GFrame/StaticAnalysisRegressionProbe.php
          set +e
          composer analyse -- --error-format=json > .phpstan-regression.json
          result=$?
          set -e
          test "$result" -ne 0
          php -r '$r=json_decode(file_get_contents(".phpstan-regression.json"),true,512,JSON_THROW_ON_ERROR); foreach ($r["files"] ?? [] as $path=>$file) { if (str_ends_with($path,"StaticAnalysisRegressionProbe.php")) foreach ($file["messages"] as $message) if (($message["identifier"] ?? "") === "return.type") exit(0); } exit(1);'
