name: Pruebas

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: composer check

  cron-mysql:
    name: Cron con MySQL y procesos reales
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gframe_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgframe_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      GFRAME_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306
      GFRAME_TEST_MYSQL_USER: root
      GFRAME_TEST_MYSQL_PASSWORD: gframe_test
      GFRAME_CRON_TEST_ENGINE: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_mysql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: php packages/phpunit/phpunit/phpunit --filter 'CronConcurrency|MySqlMigrationIntegration'

  cron-windows:
    name: Cron y CSRF con procesos Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: php packages/phpunit/phpunit/phpunit --filter 'CronConcurrency|CronHttpExecutor|VirtualCronHttp|VisitorCsrf'

  cron-https-fpm:
    name: Cron HTTPS con Nginx y PHP-FPM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: sudo apt-get update && sudo apt-get install -y nginx php8.3-fpm php8.3-sqlite3 php8.3-mbstring php8.3-xml
      - run: php packages/phpunit/phpunit/phpunit --filter CronHttpsFpmTest
        env:
          GFRAME_TEST_NGINX: /usr/sbin/nginx
          GFRAME_TEST_PHP_FPM: /usr/sbin/php-fpm8.3

  javascript:
    name: JavaScript (sin navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test --test-reporter=tap tests/js/*.test.cjs

  skills-metadata:
    name: Metadata YAML de skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python bin/validate-skills-metadata.py
      - run: python -m unittest discover -s tests -p 'test_skill_metadata.py'
