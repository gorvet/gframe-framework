<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinación de agentes</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e6e9ef; --mut:#9aa4b2;
    --claude:#6ea8fe; --codex:#5fd38a; --user:#f0b35b; --other:#b6a7f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--codex);box-shadow:0 0 8px var(--codex)}
  .mut{color:var(--mut);font-size:12px}
  main{flex:1;display:flex;min-height:0}
  #feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  aside{width:260px;border-left:1px solid var(--line);padding:14px;overflow-y:auto}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px}
  .claim{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .claim b{font-size:13px}
  .claim .files{color:var(--mut);font-size:12px;margin-top:4px;word-break:break-all}
  .msg{max-width:min(720px,92%);padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);align-self:flex-start}
  .msg .who{font-size:12px;font-weight:700;margin-bottom:2px}
  .msg .t{white-space:pre-wrap;word-wrap:break-word}
  .msg .when{font-size:11px;color:var(--mut);margin-top:4px}
  .msg.user{align-self:flex-end;border-color:#3a3320}
  .who.claude{color:var(--claude)} .who.codex{color:var(--codex)} .who.user{color:var(--user)} .who.other{color:var(--other)}
  footer{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
  footer input[type=text]{flex:1;background:#0b0d11;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 12px;font:inherit}
  footer input#name{flex:0 0 110px}
  footer button{background:var(--claude);color:#06101f;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
  footer button:disabled{opacity:.5;cursor:default}
  .empty{color:var(--mut);margin:auto}
  @media(max-width:720px){ aside{display:none} }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Coordinación de agentes</h1>
    <span class="mut" id="stamp">—</span>
  </header>
  <main>
    <div id="feed"><div class="empty">Cargando…</div></div>
    <aside>
      <h2>Reservas activas</h2>
      <div id="claims"><div class="mut">(ninguna)</div></div>
    </aside>
  </main>
  <footer>
    <input type="text" id="name" value="juank" title="Tu nombre">
    <input type="text" id="text" placeholder="Escribe para aclarar o rectificar… (Enter para enviar)" autocomplete="off">
    <button id="send">Enviar</button>
  </footer>

<script>
const feed = document.getElementById('feed');
const claimsEl = document.getElementById('claims');
const stamp = document.getElementById('stamp');
const dot = document.getElementById('dot');
const nameEl = document.getElementById('name');
const textEl = document.getElementById('text');
const sendBtn = document.getElementById('send');
let lastSig = '';

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function cls(agent){ const a=(agent||'').toLowerCase(); return a==='claude'?'claude':a==='codex'?'codex':(a==='juank'||a==='usuario'||a===(nameEl.value||'').toLowerCase())?'user':'other'; }
function when(iso){ try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; } }

function render(data){
  const msgs = data.messages || [];
  const claims = data.claims || [];
  const sig = JSON.stringify([msgs, claims]);
  if (sig === lastSig) return;          // nada nuevo, no re-render
  lastSig = sig;

  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  feed.innerHTML = msgs.length ? '' : '<div class="empty">Sin mensajes todavía.</div>';
  for (const m of msgs){
    const c = cls(m.agent);
    const div = document.createElement('div');
    div.className = 'msg' + (c==='user'?' user':'');
    div.innerHTML = '<div class="who '+c+'">'+esc(m.agent)+'</div><div class="t">'+esc(m.text)+'</div><div class="when">'+esc(when(m.at))+'</div>';
    feed.appendChild(div);
  }
  if (nearBottom) feed.scrollTop = feed.scrollHeight;

  claimsEl.innerHTML = claims.length ? '' : '<div class="mut">(ninguna)</div>';
  for (const c of claims){
    const div = document.createElement('div');
    div.className = 'claim';
    const files = (c.files||[]).map(f=>'· '+esc(f)).join('<br>');
    div.innerHTML = '<b class="who '+cls(c.agent)+'">'+esc(c.agent)+'</b> <span class="mut">'+esc(c.task||'')+'</span><div class="files">'+files+'</div>';
    claimsEl.appendChild(div);
  }
}

async function poll(){
  try{
    const r = await fetch('/api/state', {cache:'no-store'});
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || 'No se pudo leer el canal');
    render(data);
    stamp.textContent = 'actualizado ' + new Date().toLocaleTimeString();
    dot.style.background = 'var(--codex)'; dot.style.boxShadow = '0 0 8px var(--codex)';
  }catch(e){
    stamp.textContent = e.message || 'sin conexión con el servidor';
    dot.style.background = '#d35f5f'; dot.style.boxShadow = 'none';
  }
}

async function send(){
  const text = textEl.value.trim();
  const agent = (nameEl.value.trim() || 'juank').toLowerCase();
  if (!text) return;
  sendBtn.disabled = true;
  try{
    const r = await fetch('/api/say', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({agent, text})});
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || 'No se pudo enviar el mensaje');
    if (textEl.value.trim() === text) textEl.value = '';
    lastSig = '';            // fuerza re-render en el próximo poll
    await poll();
  }catch(e){ stamp.textContent = e.message || 'No se pudo enviar el mensaje'; }
  finally{ sendBtn.disabled = false; textEl.focus(); }
}

sendBtn.addEventListener('click', send);
textEl.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
